name: Lean verify

on:
  push:
  pull_request:

# 最小権限: リポジトリの読み取りのみ
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1 (コミット SHA で固定)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # leanprover/lean-action v1.7.1 (公式。elan 導入 + lean-toolchain に従い Lean v4.36.0 を取得し lake build)
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          use-mathlib-cache: "false"
          test: "false"
          lint: "false"

      # 単体ファイル検証・公理チェック・偽命題の拒否確認
      - name: Verify proofs
        run: ./scripts/verify.sh
